<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>万圣节逻辑守卫</title>
<style>
  :root {
    --bg: #0f0e11;
    --surface: #1c1a20;
    --surface-hover: #252329;
    --ink: #f4f4f5;
    --muted: #8e8b93;
    --accent: #ff5e1a;
    --accent-hover: #e65315;
    --success: #20c973;
    --danger: #ff3333;
    --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    background-color: var(--bg);
    color: var(--ink);
    font-family: var(--font-sans);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 24px;
    overflow: hidden;
  }

  .app-container {
    width: 100%;
    max-width: 440px;
    display: flex;
    flex-direction: column;
    gap: 32px;
    position: relative;
  }

  /* 顶部排版 */
  header {
    display: flex;
    flex-direction: column;
    gap: 12px;
    transition: opacity 0.3s;
  }

  h1 {
    font-size: clamp(2rem, 6vw, 2.5rem);
    font-weight: 600;
    letter-spacing: -0.02em;
    line-height: 1.1;
  }

  p.desc {
    font-size: 1rem;
    color: var(--muted);
    line-height: 1.5;
    max-width: 95%;
  }

  /* 状态栏 */
  .hud {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    font-size: 1rem;
    font-weight: 500;
    transition: opacity 0.3s;
  }

  .hud-group {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  
  .hud-group.right {
    align-items: flex-end;
  }

  .label {
    color: var(--muted);
    font-size: 0.875rem;
  }

  .score-val {
    font-size: 1.5rem;
    font-weight: 600;
    transition: transform 0.1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }

  .score-val.bump {
    transform: scale(1.3);
  }

  .hp-blocks {
    display: flex;
    gap: 6px;
    height: 24px;
    align-items: center;
  }

  .hp-block {
    width: 14px;
    height: 14px;
    background-color: var(--accent);
    border-radius: 2px;
    transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }
  
  .hp-block.empty {
    background-color: var(--surface);
    transform: scale(0.6);
    opacity: 0.3;
  }

  /* 游戏面板 */
  .board {
    background-color: var(--surface);
    border-radius: 12px;
    padding: 32px 24px;
    display: flex;
    flex-direction: column;
    gap: 32px;
    position: relative;
    overflow: hidden;
    transition: background-color 0.2s;
    min-height: 380px;
  }

  .game-content {
    display: flex;
    flex-direction: column;
    gap: 32px;
    transition: opacity 0.2s, transform 0.2s;
  }

  .game-content.hidden {
    opacity: 0;
    transform: scale(0.95);
    pointer-events: none;
  }

  /* 抖动动画 */
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-8px); }
    40% { transform: translateX(8px); }
    60% { transform: translateX(-4px); }
    80% { transform: translateX(4px); }
  }

  .board.shake {
    animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both;
  }

  .formula {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 16px;
    font-size: clamp(1.5rem, 5vw, 2rem);
    font-weight: 600;
    font-family: var(--font-mono);
  }

  .gate-name {
    color: var(--accent);
  }

  .entities {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
  }

  .entity {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    padding: 24px 16px;
    background-color: var(--bg);
    border-radius: 8px;
    transition: background-color 0.3s, transform 0.2s, opacity 0.3s;
  }

  .entity.active {
    background-color: var(--surface-hover);
  }

  @keyframes pop {
    0% { transform: scale(1); }
    50% { transform: scale(1.05); }
    100% { transform: scale(1); }
  }

  .entity.pop {
    animation: pop 0.3s ease-out;
  }

  .entity.escape {
    opacity: 0.4;
    transform: translateY(10px) scale(0.95);
  }

  .entity svg {
    width: 60px;
    height: 60px;
    color: var(--muted);
    transition: color 0.3s, transform 0.3s;
  }

  .entity.active svg {
    color: var(--accent);
  }

  .entity-val {
    font-size: 1.25rem;
    font-weight: 600;
    color: var(--muted);
    font-family: var(--font-mono);
    transition: color 0.3s;
  }

  .entity.active .entity-val {
    color: var(--ink);
  }

  .entity-label {
    font-size: 0.875rem;
    color: var(--muted);
    font-weight: 500;
  }

  /* 操作按钮 */
  .actions {
    display: flex;
    gap: 16px;
  }

  button {
    flex: 1;
    padding: 20px 16px;
    font-size: 1.125rem;
    font-weight: 600;
    font-family: var(--font-sans);
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.1s ease;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }

  button:active {
    transform: scale(0.96);
  }

  .btn-intercept {
    background-color: var(--accent);
    color: var(--bg);
  }

  .btn-intercept:hover { background-color: var(--accent-hover); }

  .btn-pass {
    background-color: var(--bg);
    color: var(--ink);
  }

  .btn-pass:hover { background-color: #1a181d; }

  .sub-text {
    font-size: 0.875rem;
    font-weight: 400;
    opacity: 0.75;
  }

  /* 飘字特效 */
  .effects-layer {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 5;
    overflow: hidden;
  }

  @keyframes floatUp {
    0% { opacity: 1; transform: translate(-50%, 0) scale(0.8); }
    20% { opacity: 1; transform: translate(-50%, -20px) scale(1.1); }
    100% { opacity: 0; transform: translate(-50%, -60px) scale(1); }
  }

  .floating-text {
    position: absolute;
    font-size: 1.5rem;
    font-weight: bold;
    animation: floatUp 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
    white-space: nowrap;
  }

  /* ================= 结算界面通用 ================= */
  .screen-overlay {
    position: absolute;
    inset: 0;
    background-color: var(--surface);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 10;
    padding: 32px;
    text-align: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.4s ease;
  }

  .screen-overlay.active {
    opacity: 1;
    pointer-events: auto;
  }

  .final-score-label {
    font-size: 0.875rem;
    color: var(--muted);
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 8px;
    margin-top: 24px;
  }

  .final-score {
    font-size: 4rem;
    font-weight: 600;
    font-family: var(--font-mono);
    line-height: 1;
    margin-bottom: 32px;
  }

  .btn-restart {
    width: 100%;
    max-width: 200px;
    background-color: var(--bg);
    color: var(--ink);
    border: none;
    padding: 16px;
    font-size: 1rem;
    border-radius: 8px;
    cursor: pointer;
  }

  .btn-restart:hover { background-color: #1a181d; }

  /* ================= 失败结算特效 (Glitch) ================= */
  .glitch-title {
    font-size: 2.5rem;
    font-weight: 800;
    color: var(--danger);
    position: relative;
    margin-bottom: 12px;
    letter-spacing: 0.1em;
  }

  .glitch-title::before,
  .glitch-title::after {
    content: attr(data-text);
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: var(--surface);
  }

  .glitch-title::before {
    left: 2px;
    text-shadow: -2px 0 var(--accent);
    clip: rect(24px, 550px, 90px, 0);
    animation: glitch-anim-2 3s infinite linear alternate-reverse;
  }

  .glitch-title::after {
    left: -2px;
    text-shadow: -2px 0 #00e5ff;
    clip: rect(85px, 550px, 140px, 0);
    animation: glitch-anim 2.5s infinite linear alternate-reverse;
  }

  @keyframes glitch-anim {
    0% { clip: rect(65px, 9999px, 100px, 0); }
    20% { clip: rect(10px, 9999px, 30px, 0); }
    40% { clip: rect(80px, 9999px, 90px, 0); }
    60% { clip: rect(30px, 9999px, 60px, 0); }
    80% { clip: rect(5px, 9999px, 20px, 0); }
    100% { clip: rect(95px, 9999px, 100px, 0); }
  }
  @keyframes glitch-anim-2 {
    0% { clip: rect(40px, 9999px, 50px, 0); }
    20% { clip: rect(90px, 9999px, 100px, 0); }
    40% { clip: rect(15px, 9999px, 25px, 0); }
    60% { clip: rect(70px, 9999px, 85px, 0); }
    80% { clip: rect(50px, 9999px, 65px, 0); }
    100% { clip: rect(10px, 9999px, 15px, 0); }
  }

  .fail-desc {
    color: var(--muted);
    font-size: 1rem;
    line-height: 1.5;
    font-family: var(--font-mono);
  }
  
  .fail-score {
    color: var(--danger);
  }

  /* ================= 胜利结算特效 (Win) ================= */
  .win-title {
    font-size: 2rem;
    font-weight: 600;
    color: var(--success);
    margin-bottom: 12px;
    letter-spacing: 0.05em;
    opacity: 0;
    transform: translateY(10px);
    animation: slideUp 0.6s 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }

  .win-desc {
    color: var(--muted);
    font-size: 1rem;
    line-height: 1.5;
    opacity: 0;
    transform: translateY(10px);
    animation: slideUp 0.6s 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }

  .win-score {
    color: var(--success);
    opacity: 0;
    animation: fadeIn 0.5s 0.8s forwards;
  }

  /* SVG 打勾动画 */
  .success-checkmark {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    display: block;
    stroke-width: 3;
    stroke: var(--success);
    stroke-miterlimit: 10;
    box-shadow: inset 0px 0px 0px var(--success);
    animation: fill .4s ease-in-out .4s forwards, scale .3s ease-in-out .9s both;
  }

  .success-checkmark__circle {
    stroke-dasharray: 166;
    stroke-dashoffset: 166;
    stroke-width: 3;
    stroke-miterlimit: 10;
    stroke: var(--success);
    fill: none;
    animation: stroke 0.6s cubic-bezier(0.65, 0, 0.45, 1) forwards;
  }

  .success-checkmark__check {
    transform-origin: 50% 50%;
    stroke-dasharray: 48;
    stroke-dashoffset: 48;
    animation: stroke 0.3s cubic-bezier(0.65, 0, 0.45, 1) 0.8s forwards;
  }

  @keyframes stroke { 100% { stroke-dashoffset: 0; } }
  @keyframes scale { 0%, 100% { transform: none; } 50% { transform: scale3d(1.1, 1.1, 1); } }
  @keyframes fill { 100% { box-shadow: inset 0px 0px 0px 40px rgba(32, 201, 115, 0.1); } }
  @keyframes slideUp { 100% { opacity: 1; transform: translateY(0); } }
  @keyframes fadeIn { 100% { opacity: 1; } }

  /* 像素雨（胜利时飘落的极简几何块） */
  .pixel {
    position: absolute;
    width: 8px;
    height: 8px;
    background-color: var(--success);
    top: -20px;
    animation: pixelFall linear forwards;
  }
  @keyframes pixelFall {
    0% { transform: translateY(0) rotate(0deg); opacity: 1; }
    100% { transform: translateY(400px) rotate(180deg); opacity: 0; }
  }
  
  .hide-hud {
    opacity: 0;
    pointer-events: none;
  }
</style>
</head>
<body>

  <main class="app-container">
    
    <header id="header">
      <h1>万圣节逻辑守卫</h1>
      <p class="desc">判断逻辑门的结果。达到 <strong>100 分</strong> 即为守卫成功。</p>
    </header>

    <section class="hud" id="hud" aria-label="游戏状态">
      <div class="hud-group">
        <span class="label">得分</span>
        <span class="score-val" id="score">0</span>
      </div>
      <div class="hud-group right">
        <span class="label">生命</span>
        <div class="hp-blocks" id="hp-container"></div>
      </div>
    </section>

    <section class="board" id="game-board">
      
      <div class="effects-layer" id="effects-layer"></div>

      <!-- 正常游戏区 -->
      <div class="game-content" id="game-content">
        <div class="formula" id="formula">
          <span id="val-a">1</span>
          <span class="gate-name" id="gate-name">AND</span>
          <span id="val-b">1</span>
        </div>

        <div class="entities">
          <div class="entity" id="ent-a">
            <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
              <path d="M10,90 L10,40 C10,15 30,5 50,5 C70,5 90,15 90,40 L90,90 L80,80 L70,90 L60,80 L50,90 L40,80 L30,90 L20,80 L10,90 Z" fill="currentColor"/>
              <circle cx="35" cy="45" r="6" fill="var(--bg)"/>
              <circle cx="65" cy="45" r="6" fill="var(--bg)"/>
            </svg>
            <span class="entity-val" id="txt-a">1</span>
            <span class="entity-label">Trick</span>
          </div>
          
          <div class="entity" id="ent-b">
            <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
              <path d="M50,25 C20,25 10,45 10,65 C10,85 20,95 50,95 C80,95 90,85 90,65 C90,45 80,25 50,25 Z" fill="currentColor"/>
              <rect x="48" y="10" width="4" height="15" fill="currentColor" rx="2"/>
              <path d="M30,55 L45,55 L45,60 L30,60 Z" fill="var(--bg)"/>
              <path d="M55,55 L70,55 L70,60 L55,60 Z" fill="var(--bg)"/>
              <path d="M40,75 L50,65 L60,75 Z" fill="var(--bg)"/>
            </svg>
            <span class="entity-val" id="txt-b">1</span>
            <span class="entity-label">Treat</span>
          </div>
        </div>

        <div class="actions" id="actions">
          <button class="btn-intercept" onclick="checkAnswer(1, event)">
            拦截
            <span class="sub-text">结果为 1</span>
          </button>
          <button class="btn-pass" onclick="checkAnswer(0, event)">
            放行
            <span class="sub-text">结果为 0</span>
          </button>
        </div>
      </div>

      <!-- 失败结算 -->
      <div class="screen-overlay" id="screen-fail">
        <h2 class="glitch-title" data-text="系统崩溃">系统崩溃</h2>
        <p class="fail-desc">幽灵逃走了，你未能守住大门。</p>
        <span class="final-score-label">最终得分</span>
        <div class="final-score fail-score" id="fail-score">0</div>
        <button class="btn-restart" onclick="startGame()">重新编译</button>
      </div>

      <!-- 胜利结算 -->
      <div class="screen-overlay" id="screen-win">
        <!-- SVG 勾号 -->
        <svg class="success-checkmark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 52 52">
          <circle class="success-checkmark__circle" cx="26" cy="26" r="25" fill="none"/>
          <path class="success-checkmark__check" fill="none" d="M14.1 27.2l7.1 7.2 16.7-16.8"/>
        </svg>
        <h2 class="win-title">守卫成功</h2>
        <p class="win-desc">逻辑清晰，你成功守住了万圣节的大门。</p>
        <span class="final-score-label">最终得分</span>
        <div class="final-score win-score" id="win-score">0</div>
        <button class="btn-restart" onclick="startGame()" style="margin-top: 16px;">再次守卫</button>
      </div>
      
    </section>
  </main>

<script>
  const GATES = ['OR', 'AND', 'XOR', 'NOR', 'NAND', 'XNOR'];
  const TARGET_SCORE = 100;
  
  let score = 0;
  let hp = 3;
  let currentA = 0;
  let currentB = 0;
  let currentGate = 'AND';
  let correctAnswer = 0;
  let isPlaying = false;
  let isAnimating = false;

  const scoreEl = document.getElementById('score');
  const hpContainer = document.getElementById('hp-container');
  const boardEl = document.getElementById('game-board');
  const gameContent = document.getElementById('game-content');
  const headerEl = document.getElementById('header');
  const hudEl = document.getElementById('hud');
  
  const screenFail = document.getElementById('screen-fail');
  const screenWin = document.getElementById('screen-win');
  const failScoreEl = document.getElementById('fail-score');
  const winScoreEl = document.getElementById('win-score');
  const effectsLayer = document.getElementById('effects-layer');

  const valAEl = document.getElementById('val-a');
  const valBEl = document.getElementById('val-b');
  const gateNameEl = document.getElementById('gate-name');
  const entAEl = document.getElementById('ent-a');
  const entBEl = document.getElementById('ent-b');
  const txtAEl = document.getElementById('txt-a');
  const txtBEl = document.getElementById('txt-b');

  function calcGate(a, b, gate) {
    switch (gate) {
      case 'OR': return (a || b) ? 1 : 0;
      case 'AND': return (a && b) ? 1 : 0;
      case 'XOR': return (a !== b) ? 1 : 0;
      case 'NOR': return (!(a || b)) ? 1 : 0;
      case 'NAND': return (!(a && b)) ? 1 : 0;
      case 'XNOR': return (a === b) ? 1 : 0;
      default: return 0;
    }
  }

  function updateHUD() {
    scoreEl.textContent = score;
    scoreEl.classList.add('bump');
    setTimeout(() => scoreEl.classList.remove('bump'), 150);

    hpContainer.innerHTML = '';
    for (let i = 0; i < 3; i++) {
      const block = document.createElement('div');
      block.className = 'hp-block' + (i >= hp ? ' empty' : '');
      hpContainer.appendChild(block);
    }
  }

  function createFloatingText(text, color) {
    const el = document.createElement('div');
    el.className = 'floating-text';
    el.textContent = text;
    el.style.color = color;
    const x = 50 + (Math.random() * 10 - 5); 
    const y = 40 + (Math.random() * 10 - 5);
    el.style.left = x + '%';
    el.style.top = y + '%';
    effectsLayer.appendChild(el);
    setTimeout(() => el.remove(), 800);
  }

  // 生成胜利像素雨
  function createPixelRain() {
    for (let i = 0; i < 30; i++) {
      setTimeout(() => {
        const el = document.createElement('div');
        el.className = 'pixel';
        el.style.left = Math.random() * 100 + '%';
        // 随机颜色（绿/白/橙）
        const colors = ['var(--success)', 'var(--ink)', 'var(--accent)'];
        el.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
        // 随机大小
        const size = 6 + Math.random() * 6;
        el.style.width = size + 'px';
        el.style.height = size + 'px';
        el.style.animationDuration = (1 + Math.random()) + 's';
        
        screenWin.appendChild(el);
        setTimeout(() => el.remove(), 2000);
      }, i * 50); // 错开下落时间
    }
  }

  // 数字滚动动效
  function animateScore(targetEl, targetScore) {
    let current = 0;
    const duration = 1000; // 1秒
    const steps = 30;
    const stepTime = duration / steps;
    const increment = targetScore / steps;

    const timer = setInterval(() => {
      current += increment;
      if (current >= targetScore) {
        targetEl.textContent = targetScore;
        clearInterval(timer);
      } else {
        targetEl.textContent = Math.floor(current);
      }
    }, stepTime);
  }

  function startGame() {
    score = 0;
    hp = 3;
    isPlaying = true;
    isAnimating = false;
    
    // 重置 UI
    screenFail.classList.remove('active');
    screenWin.classList.remove('active');
    gameContent.classList.remove('hidden');
    headerEl.classList.remove('hide-hud');
    hudEl.classList.remove('hide-hud');
    boardEl.classList.remove('shake');
    
    updateHUD();
    nextRound();
  }

  function nextRound() {
    if (!isPlaying) return;
    
    currentA = Math.random() > 0.5 ? 1 : 0;
    currentB = Math.random() > 0.5 ? 1 : 0;
    currentGate = GATES[Math.floor(Math.random() * GATES.length)];
    correctAnswer = calcGate(currentA, currentB, currentGate);

    valAEl.textContent = currentA;
    valBEl.textContent = currentB;
    gateNameEl.textContent = currentGate;
    
    txtAEl.textContent = currentA;
    txtBEl.textContent = currentB;

    entAEl.className = 'entity';
    entBEl.className = 'entity';
    
    if (currentA === 1) entAEl.classList.add('active');
    if (currentB === 1) entBEl.classList.add('active');
  }

  function checkAnswer(playerAns, event) {
    if (!isPlaying || isAnimating) return;
    isAnimating = true;

    if (playerAns === correctAnswer) {
      score += 10;
      updateHUD();
      createFloatingText('+10', 'var(--success)');
      
      const activeEntity = currentA === 1 ? entAEl : entBEl;
      activeEntity.classList.add('pop');
      if (currentA === 1 && currentB === 1) entBEl.classList.add('pop');

      if (score >= TARGET_SCORE) {
        setTimeout(winGame, 400);
        return;
      }

      setTimeout(() => {
        isAnimating = false;
        nextRound();
      }, 300);

    } else {
      hp--;
      updateHUD();
      createFloatingText('Syntax Error', 'var(--danger)');
      
      boardEl.classList.add('shake');
      entAEl.classList.add('escape');
      entBEl.classList.add('escape');
      
      setTimeout(() => {
        boardEl.classList.remove('shake');
      }, 400);

      if (hp <= 0) {
        setTimeout(gameOver, 500);
      } else {
        setTimeout(() => {
          isAnimating = false;
          nextRound();
        }, 600);
      }
    }
  }

  function winGame() {
    isPlaying = false;
    gameContent.classList.add('hidden');
    headerEl.classList.add('hide-hud');
    hudEl.classList.add('hide-hud');
    
    screenWin.classList.add('active');
    winScoreEl.textContent = '0';
    
    // 触发通关动效
    animateScore(winScoreEl, score);
    createPixelRain();
  }

  function gameOver() {
    isPlaying = false;
    gameContent.classList.add('hidden');
    headerEl.classList.add('hide-hud');
    hudEl.classList.add('hide-hud');
    
    screenFail.classList.add('active');
    failScoreEl.textContent = '0';
    
    // 触发失败动效（数字跳动，但不加礼花）
    animateScore(failScoreEl, score);
  }

  startGame();
</script>
</body>
</html>
