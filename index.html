<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>万圣节逻辑特辑 · 计乐吾心</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    background-color: #0f0c1b;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
    overflow-x: hidden;
    position: relative;
  }

  /* 星空背景点缀 */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: radial-gradient(white 1px, transparent 1px);
    background-size: 40px 40px;
    opacity: 0.08;
    pointer-events: none;
    z-index: 0;
  }

  /* 飘落的万圣节元素 */
  .floating-icon {
    position: fixed;
    top: -30px;
    font-size: 20px;
    opacity: 0;
    pointer-events: none;
    animation: fall linear infinite;
    z-index: 0;
  }
  @keyframes fall {
    0% { transform: translateY(0) rotate(0deg); opacity: 0; }
    10% { opacity: 0.6; }
    90% { opacity: 0.2; }
    100% { transform: translateY(105vh) rotate(360deg); opacity: 0; }
  }

  .app {
    max-width: 500px;
    width: 100%;
    text-align: center;
    position: relative;
    z-index: 1;
  }

  header {
    margin-bottom: 24px;
  }
  header h1 {
    font-size: 24px;
    margin-bottom: 10px;
    color: #ff8c00;
    text-shadow: 0 0 15px rgba(255, 140, 0, 0.4);
    letter-spacing: 2px;
    font-weight: 600;
  }
  header p {
    font-size: 14px;
    color: #9b95a5;
    letter-spacing: 1px;
  }

  .venn-wrapper {
    width: 100%;
    max-width: 360px;
    margin: 0 auto 24px;
    background: rgba(255, 255, 255, 0.02);
    border-radius: 24px;
    padding: 16px;
    border: 1px solid rgba(255, 255, 255, 0.05);
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
  }

  .venn-svg {
    width: 100%;
    height: auto;
    display: block;
  }

  .venn-label {
    font-size: 22px;
    font-weight: bold;
    fill: #fff;
    font-family: 'Courier New', Courier, monospace;
    letter-spacing: 1px;
  }

  /* 区域颜色类 */
  .region-dark {
    fill: #1c1628;
    transition: fill 0.4s ease;
  }

  .region-highlight {
    fill: #ff7518; /* 南瓜橙 */
    transition: fill 0.4s ease;
  }

  /* 控制按钮 */
  .controls {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
    margin-bottom: 24px;
  }

  .gate-btn {
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.1);
    color: #bbb;
    padding: 10px 18px;
    border-radius: 10px;
    cursor: pointer;
    font-family: 'Courier New', Courier, monospace;
    font-size: 15px;
    font-weight: bold;
    transition: all 0.2s;
  }

  .gate-btn:hover {
    background: rgba(255, 255, 255, 0.1);
    color: #fff;
  }

  .gate-btn.active {
    background: #ff7518;
    border-color: #ff7518;
    color: #fff;
    box-shadow: 0 0 20px rgba(255, 117, 24, 0.5);
    transform: translateY(-2px);
  }

  /* 结果卡片 */
  .result-card {
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 16px;
    padding: 24px 20px;
    margin-bottom: 30px;
    min-height: 140px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
  }

  .result-title {
    font-size: 24px;
    font-weight: bold;
    color: #ff8c00;
    margin-bottom: 12px;
    font-family: 'Courier New', Courier, monospace;
    letter-spacing: 1px;
  }

  .result-desc {
    font-size: 15px;
    color: #e0e0e0;
    line-height: 1.6;
    margin-bottom: 16px;
    letter-spacing: 0.5px;
  }

  .result-expr {
    font-size: 13px;
    color: #888;
    font-family: 'Courier New', Courier, monospace;
    background: rgba(0, 0, 0, 0.4);
    padding: 6px 14px;
    border-radius: 20px;
    border: 1px solid rgba(255, 255, 255, 0.05);
  }

  footer {
    font-size: 12px;
    color: rgba(255, 255, 255, 0.3);
    line-height: 1.8;
    margin-top: 20px;
    letter-spacing: 1px;
  }
</style>
</head>
<body>

  <div class="app">
    <header>
      <h1>🎃 万圣节逻辑特辑 🎃</h1>
      <p>点击下方逻辑门，看看今年万圣节怎么过</p>
    </header>

    <div class="venn-wrapper">
      <svg viewBox="0 0 440 400" class="venn-svg">
        <defs>
          <!-- 两个圆的裁剪路径 -->
          <clipPath id="clipA">
            <circle cx="160" cy="200" r="120" />
          </clipPath>
          <clipPath id="clipB">
            <circle cx="280" cy="200" r="120" />
          </clipPath>
          <!-- 遮罩：用来抠掉另一个圆 -->
          <mask id="notB">
            <rect width="440" height="400" fill="white" />
            <circle cx="280" cy="200" r="120" fill="black" />
          </mask>
          <mask id="notA">
            <rect width="440" height="400" fill="white" />
            <circle cx="160" cy="200" r="120" fill="black" />
          </mask>
        </defs>
        
        <!-- 1. 外部背景 -->
        <rect id="region-exterior" width="440" height="400" class="region-dark" />
        
        <!-- 2. 左边月牙 (Trick only) -->
        <g clip-path="url(#clipA)">
          <rect id="region-left" width="440" height="400" class="region-dark" mask="url(#notB)" />
        </g>
        
        <!-- 3. 右边月牙 (Treat only) -->
        <g clip-path="url(#clipB)">
          <rect id="region-right" width="440" height="400" class="region-dark" mask="url(#notA)" />
        </g>
        
        <!-- 4. 交集 (Both) -->
        <g clip-path="url(#clipA)">
          <circle id="region-intersection" cx="280" cy="200" r="120" class="region-dark" />
        </g>
        
        <!-- 5. 两个圆的边框 -->
        <circle cx="160" cy="200" r="120" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="2" />
        <circle cx="280" cy="200" r="120" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="2" />
        
        <!-- 6. 文字标签 -->
        <text x="160" y="50" class="venn-label" text-anchor="middle">Trick</text>
        <text x="280" y="50" class="venn-label" text-anchor="middle">Treat</text>
      </svg>
    </div>

    <div class="controls">
      <button data-gate="OR" class="gate-btn active">OR</button>
      <button data-gate="AND" class="gate-btn">AND</button>
      <button data-gate="XOR" class="gate-btn">XOR</button>
      <button data-gate="NOR" class="gate-btn">NOR</button>
      <button data-gate="NAND" class="gate-btn">NAND</button>
      <button data-gate="XNOR" class="gate-btn">XNOR</button>
    </div>

    <div class="result-card">
      <div class="result-title" id="result-title">Trick OR Treat</div>
      <div class="result-desc" id="result-desc">经典万圣节。要么捣蛋，要么给糖，或者都给！</div>
      <div class="result-expr" id="result-expr">A ∪ B</div>
    </div>

    <footer>
      水清木华，计乐吾心
    </footer>
  </div>

<script>
  // 飘落的万圣节图标
  (function makeIcons() {
    const icons = ['🎃', '👻', '🦇', '🕷️', '🍬'];
    for (let i = 0; i < 12; i++) {
      const el = document.createElement('div');
      el.className = 'floating-icon';
      el.textContent = icons[Math.floor(Math.random() * icons.length)];
      el.style.left = Math.random() * 100 + '%';
      el.style.animationDuration = (10 + Math.random() * 10) + 's';
      el.style.animationDelay = (Math.random() * 15) + 's';
      el.style.fontSize = (16 + Math.random() * 16) + 'px';
      document.body.appendChild(el);
    }
  })();

  // 逻辑门配置
  const gates = {
    OR: {
      exterior: 'region-dark',
      left: 'region-highlight',
      right: 'region-highlight',
      intersection: 'region-highlight',
      title: 'Trick OR Treat',
      desc: '经典万圣节。要么捣蛋，要么给糖，或者都给！',
      expr: 'A ∪ B'
    },
    AND: {
      exterior: 'region-dark',
      left: 'region-dark',
      right: 'region-dark',
      intersection: 'region-highlight',
      title: 'Trick AND Treat',
      desc: '小孩子才做选择，成年人我全都要！',
      expr: 'A ∩ B'
    },
    XOR: {
      exterior: 'region-dark',
      left: 'region-highlight',
      right: 'region-highlight',
      intersection: 'region-dark',
      title: 'Trick XOR Treat',
      desc: '二选一，不准贪心。今天只能拿一样！',
      expr: 'A ⊕ B'
    },
    NOR: {
      exterior: 'region-highlight',
      left: 'region-dark',
      right: 'region-dark',
      intersection: 'region-dark',
      title: 'Trick NOR Treat',
      desc: '既不给糖，也不捣蛋。今天只做安静的代码人。',
      expr: '¬(A ∪ B)'
    },
    NAND: {
      exterior: 'region-highlight',
      left: 'region-highlight',
      right: 'region-highlight',
      intersection: 'region-dark',
      title: 'Trick NAND Treat',
      desc: '不能又要捣蛋又要糖，鱼和熊掌不可兼得。',
      expr: '¬(A ∩ B)'
    },
    XNOR: {
      exterior: 'region-highlight',
      left: 'region-dark',
      right: 'region-dark',
      intersection: 'region-highlight',
      title: 'Trick XNOR Treat',
      desc: '要么一起捣蛋，要么一起给糖，同生共死！',
      expr: '¬(A ⊕ B)'
    }
  };

  const btnGroup = document.querySelectorAll('.gate-btn');
  const titleEl = document.getElementById('result-title');
  const descEl = document.getElementById('result-desc');
  const exprEl = document.getElementById('result-expr');

  const extEl = document.getElementById('region-exterior');
  const leftEl = document.getElementById('region-left');
  const rightEl = document.getElementById('region-right');
  const intEl = document.getElementById('region-intersection');

  // 绑定按钮点击事件
  btnGroup.forEach(btn => {
    btn.addEventListener('click', () => {
      const gate = btn.dataset.gate;
      const config = gates[gate];
      
      // 更新按钮选中状态
      btnGroup.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      
      // 更新 SVG 区域颜色
      extEl.setAttribute('class', config.exterior);
      leftEl.setAttribute('class', config.left);
      rightEl.setAttribute('class', config.right);
      intEl.setAttribute('class', config.intersection);
      
      // 更新下方文案
      titleEl.textContent = config.title;
      descEl.textContent = config.desc;
      exprEl.textContent = config.expr;
    });
  });
</script>
</body>
</html>
